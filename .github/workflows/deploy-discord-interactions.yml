name: Manually Deploy Discord Interactions
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm deployment
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-discord-interactions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "DEPLOY" ]]; then
            echo "::error::Confirmation must be exactly DEPLOY"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify function entrypoint
        run: |
          test -f supabase/functions/discord-interactions/index.ts || {
            echo "::error::discord-interactions entrypoint not found"
            exit 1
          }
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy discord-interactions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          supabase functions deploy discord-interactions --project-ref lnauhbnisreigaqoeabq --use-api --yes
