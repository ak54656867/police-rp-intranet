name: Automatic patch notes

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/patch-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automatic-patch-notes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build version and patch notes from actual changes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          SUBJECT="$(git log -1 --pretty=%s "$GITHUB_SHA")"

          if [[ -n "$LAST_TAG" ]]; then
            BASE_VERSION="${LAST_TAG#v}"
            RANGE="$LAST_TAG..$GITHUB_SHA"
            BASE_REF="$LAST_TAG"
          else
            BASE_VERSION="1.0.0"
            RANGE=""
            BASE_REF=""
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if [[ "$SUBJECT" =~ \[(major|대개편)\] ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [[ "$SUBJECT" =~ \[(minor|기능)\] ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          VERSION="$MAJOR.$MINOR.$PATCH"

          if [[ -n "$BASE_REF" ]]; then
            COMMITS="$(git log --format='- %s' "$RANGE" | head -n 12)"
            FILES="$(git diff --name-only "$RANGE" | grep -v '^\.github/workflows/patch-notes\.yml$' | head -n 15 || true)"
          else
            COMMITS="- $SUBJECT"
            FILES="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -v '^\.github/workflows/patch-notes\.yml$' | head -n 15 || true)"
          fi

          if [[ -z "$FILES" ]]; then
            echo "No application files changed; skipping patch-note publication."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "body<<PATCH_NOTES_EOF"
            echo "**버전:** v$VERSION"
            echo
            echo "**변경 사항 (커밋 기록):**"
            echo "$COMMITS"
            echo
            echo "**변경된 파일:**"
            while IFS= read -r file; do
              [[ -n "$file" ]] && printf -- '- `%s`\n' "$file"
            done <<< "$FILES"
            echo
            echo "_변경 사항은 실제 Git 커밋 및 변경 파일 기준으로 자동 생성되었습니다._"
            echo "PATCH_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Publish through the existing intranet announcement system
        if: steps.notes.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PATCH_NOTES_SECRET: ${{ secrets.PATCH_NOTES_SECRET }}
          PATCH_VERSION: ${{ steps.notes.outputs.version }}
          PATCH_BODY: ${{ steps.notes.outputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" || -z "$PATCH_NOTES_SECRET" ]]; then
            echo "::error::Configure SUPABASE_URL, SUPABASE_ANON_KEY, and PATCH_NOTES_SECRET in GitHub Actions secrets."
            exit 1
          fi

          jq -n --arg version "$PATCH_VERSION" --arg title "v$PATCH_VERSION" --arg body "$PATCH_BODY" \
            '{kind:"patch-note-publish", version:$version, title:$title, body:$body}' > /tmp/patch-notes.json

          curl --fail-with-body --silent --show-error \
            -X POST "${SUPABASE_URL%/}/functions/v1/discord-interactions" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-patch-notes-secret: $PATCH_NOTES_SECRET" \
            --data-binary @/tmp/patch-notes.json

      - name: Tag published version
        if: steps.notes.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
