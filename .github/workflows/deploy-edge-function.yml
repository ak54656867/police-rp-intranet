name: Deploy Supabase Edge Function
on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Edge Function folder name under supabase/functions
        required: true
        type: string
      verify_jwt:
        description: Require JWT verification
        required: false
        default: "true"
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate function name
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          if [[ ! "$FUNCTION_NAME" =~ ^[a-z0-9-]{1,60}$ ]]; then
            echo "::error::Invalid Edge Function name"
            exit 1
          fi
          if [[ "$FUNCTION_NAME" == "discord-interactions" ]]; then
            echo "::error::The AI control function is protected from remote self-deployment"
            exit 1
          fi
          if [[ ! -f "supabase/functions/$FUNCTION_NAME/index.ts" ]]; then
            echo "::error::Function entrypoint not found"
            exit 1
          fi
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          supabase functions deploy "$FUNCTION_NAME" --project-ref lnauhbnisreigaqoeabq --use-api --yes
